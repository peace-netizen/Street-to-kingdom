<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Street to Kingdom</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#121a33;--card:#1b2646;--line:#2e3c68;--ink:#f3ecda;--mut:#9aa6c9;--gold:#e8ab2c;--leaf:#3fae6d;--red:#e0584a;--blue:#5aa0e8;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:40px;line-height:1;margin:30px 0 8px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.g{flex:1}.mut{color:var(--mut);font-size:13px}
button{font:inherit;font-weight:600;background:var(--gold);color:#241800;border:0;border-radius:10px;padding:10px 14px}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.4}
input{font:inherit;width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid var(--line);background:#0e1529;color:var(--ink)}
.bar{height:8px;background:#0e1529;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%}
.wal{font-size:32px;font-weight:800;color:var(--gold)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0c1228;border-top:1px solid var(--line)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:15px 2px}nav button.on{color:var(--gold);box-shadow:inset 0 2px var(--gold)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}.sw.on{border-color:#fff}
#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:9px 16px;border-radius:30px;font-weight:600;z-index:9;opacity:0;transition:opacity .3s;max-width:90%;text-align:center;pointer-events:none}#toast.on{opacity:1}
</style></head><body><div id="app"></div><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Publishable key is safe in the browser. NEVER put a secret/service_role key here.
const sb=supabase.createClient('https://gqyjjvorczzwqzjnmdol.supabase.co','sb_publishable_2c4-3xtNDcTN33pvupk8JQ_ssWkM0mo');
const $=s=>document.querySelector(s),N=n=>'₦'+Math.round(n).toLocaleString();
const SKIN=['#f1c9a0','#d9a273','#b57a4a','#8a5632','#5a3520'],CLOTH=['#e8ab2c','#3fae6d','#5aa0e8','#e0584a'];
let me=null,jobs=[],foods=[],housing=[],cases=[],cd={},tab='home',mode='in',draft={skin:1,cl:0},XP=[0,100,250,500,900,1500,2400,3600,5200,7500,10500,14000,18000,23000,30000];
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(t.h);t.h=setTimeout(()=>t.className='',2600)}
const av=(c,z)=>`<svg viewBox="0 0 64 64" width="${z}" height="${z}" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#2e3c68"/><path d="M12 64c2-14 12-18 20-18s18 4 20 18z" fill="${CLOTH[c.cl||0]}"/><circle cx="32" cy="30" r="12" fill="${SKIN[c.skin??1]}"/><path d="M20 28c0-13 24-13 24 0-5-6-19-6-24 0z" fill="#111"/></svg>`;
function nextXp(l){let n=XP[Math.min(l,15)];if(l>=15){n=XP[14];for(let i=15;i<=l;i++)n=Math.round(n*1.25/100)*100}return n}
async function load(){const r=await sb.rpc('get_me');if(r.error)return toast(r.error.message);me=r.data;
const[hs,j,f,l,cs]=await Promise.all([sb.from('housing').select('*').order('price'),sb.from('jobs').select('*').order('income'),sb.from('foods').select('*').order('price'),sb.from('job_log').select('job_id,created_at').order('created_at',{ascending:false}).limit(100),sb.from('cases').select('*').order('opened_at',{ascending:false}).limit(20)]);cases=cs.data||[];
housing=hs.data||[];jobs=j.data||[];foods=f.data||[];cd={};(l.data||[]).forEach(x=>{if(!cd[x.job_id])cd[x.job_id]=new Date(x.created_at).getTime()});render()}
async function act(fn,args,msg){const r=await sb.rpc(fn,{...args,p_idem:crypto.randomUUID()});if(r.error)return toast(r.error.message);toast(msg(r.data));await load()}
const A={
mode(m){mode=m;render()},
async auth(){const e=$('#em').value.trim(),p=$('#pw').value;if(mode=='up'){const u=$('#un').value.trim();if(!/^[A-Za-z0-9_]{3,16}$/.test(u))return toast('Username: 3-16 letters, numbers or _');
const r=await sb.auth.signUp({email:e,password:p,options:{data:{username:u}}});if(r.error)return toast(r.error.message);if(!r.data.session)return toast('Check your email to confirm, then log in')}
else{const r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)return toast(r.error.message)}await load()},
pick(i){const[k,v]=i.split(':');draft[k]=+v;render()},
async save(){const r=await sb.rpc('update_profile',{p_bio:'',p_avatar:{...draft,set:1}});if(r.error)return toast(r.error.message);await load()},
go(t){tab=t;render()},
work(i){const j=jobs.find(x=>x.id==i);act('work_job',{p_job:i},d=>d.duplicate?'Already done':'+'+N(d.paid)+' · +'+d.xp+' XP')},
pay(i){act('court_pay',{p_case:+i},d=>'Fine paid. Case closed.')},fight(i){act('court_fight',{p_case:+i},d=>d.won?'Case dismissed! You won.':'Lost in court. Fine applied.')},buy(i){act('buy_housing',{p_home:i},()=>'You moved in!')},rest(){act('rest',{},d=>'Rested. Energy '+d.energy)},eat(i){act('buy_food',{p_food:i},d=>'Hunger now '+d.hunger)},
async out(){await sb.auth.signOut();me=null;render()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.i)});
const bar=(l,v,c)=>`<div class="row sp mut"><span>${l}</span><span>${v}/100</span></div><div class="bar"><i style="width:${v}%;background:${c}"></i></div><br>`;
function render(){const a=$('#app');
if(!me){a.innerHTML=`<h1>Street to Kingdom</h1><p>Start with ₦0. Build your Kingdom.</p><div class="card">${mode=='up'?'<input id="un" placeholder="Username" autocomplete="username">':''}<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password"><button data-a="auth" style="width:100%;margin-top:6px">${mode=='up'?'Create account':'Log in'}</button></div><button class="alt" data-a="mode" data-i="${mode=='up'?'in':'up'}">${mode=='up'?'I have an account':'Create account'}</button>`;return}
const p=me.profile;
if(!p.avatar||!p.avatar.set){a.innerHTML=`<h1 style="font-size:28px">Create your character</h1><div class="card" style="text-align:center">${av(draft,110)}</div><div class="card"><p class="mut">Skin</p><div class="row">${SKIN.map((c,i)=>`<button class="sw ${draft.skin==i?'on':''}" style="background:${c}" data-a="pick" data-i="skin:${i}" aria-label="Skin ${i+1}"></button>`).join('')}</div><p class="mut">Outfit</p><div class="row">${CLOTH.map((c,i)=>`<button class="sw ${draft.cl==i?'on':''}" style="background:${c}" data-a="pick" data-i="cl:${i}" aria-label="Outfit ${i+1}"></button>`).join('')}</div></div><button data-a="save" style="width:100%">Begin with ₦0</button>`;return}
const frozen=p.frozen_until&&new Date(p.frozen_until)>new Date();const L=me.level,lo=XP[L-1]??nextXp(L-1),hi=nextXp(L),pc=Math.min(100,(p.xp-lo)/(hi-lo)*100);let v='';
const head=`<div class="card"><div class="row">${av(p.avatar,56)}<div class="g"><b>${p.username}</b><div class="mut">Level ${L} · ${me.title} · Rep ${Number(p.reputation).toFixed(1)}</div><div class="bar" style="margin-top:5px"><i style="width:${pc}%;background:var(--blue)"></i></div><div class="mut">${p.xp} / ${hi} XP</div></div></div><div class="wal">${N(p.wallet)}</div></div>`;
if(tab=='home')v=`<div class="card">${bar('Energy',p.energy,'var(--gold)')}${bar('Hunger',p.hunger,'var(--leaf)')}${bar('Hygiene',p.hygiene,'var(--blue)')}${bar('Health',p.health,'var(--red)')}</div><div class="card mut">Energy regenerates +5 every 30 minutes. Hunger drops 5 every 2 hours. Everything is checked on the server.</div><div class="card row sp"><div><b>${(housing.find(h=>h.id==p.home)||{}).name||'Street Shelter'}</b><div class="mut">Rest restores energy every 30 min</div></div><button data-a="rest">Rest</button></div>${frozen?'<div class="card" style="border-color:var(--red)"><b style="color:var(--red)">Assets frozen by KFCC</b><div class="mut">Property purchases are blocked until '+new Date(p.frozen_until).toLocaleTimeString()+'. Settle it in Court to unfreeze sooner.</div></div>':''}<div class="card">${bar('Attention (KFCC / Police)',Math.round(p.heat),'var(--red)')}<div class="mut">Big purchases raise attention. It cools down over time. At 100 your assets freeze; around 60 you risk a police raid.</div></div><h2>Coming soon</h2><div class="card mut">City map · Transport · Phone · Chat · Businesses · Vehicles</div><button class="alt" data-a="out">Log out</button>`;
if(tab=='jobs')v=jobs.map(j=>{const lock=L<j.min_level,wait=Math.max(0,Math.ceil(((cd[j.id]||0)+j.cooldown_min*6e4-Date.now())/1000));return `<div class="card ${lock?'mut':''}"><div class="row sp"><b>${j.name}</b><b style="color:var(--gold)">${N(j.income)}</b></div><div class="mut">-${j.energy} energy · ${j.cooldown_min} min cooldown · +${j.xp} XP${lock?' · needs level '+j.min_level:''}${wait?' · ready in '+Math.ceil(wait/60)+' min':''}</div><br><button data-a="work" data-i="${j.id}" ${lock||wait?'disabled':''}>Work</button></div>`}).join('');
if(tab=='eat')v=foods.map(f=>`<div class="card row sp"><div><b>${f.name}</b><div class="mut">+${f.hunger} hunger</div></div><button data-a="eat" data-i="${f.id}">${N(f.price)}</button></div>`).join('');
if(tab=='court')v=(cases.length?cases.map(c=>`<div class="card"><div class="row sp"><b>${c.title}</b><span class="mut">${c.status}</span></div><div class="mut">${c.kind=='raid'?'Seized '+N(c.seized):'Fine '+N(c.fine)}</div>${c.status=='open'?`<br><div class="row"><button class="g" data-a="pay" data-i="${c.id}" ${c.fine>0?'':'disabled'}>Pay fine</button><button class="g alt" data-a="fight" data-i="${c.id}">Hire lawyer (${N(Math.max(1000,Math.round(c.fine*.1)))})</button></div>`:''}</div>`).join(''):'<div class="card mut">No cases. Stay clean and keep your attention level low.</div>')+'<div class="card mut">Win chance depends on your reputation. Winning dismisses the case and returns anything seized. Losing adds 25% to the fine and costs reputation.</div>';
if(tab=='house')v=housing.map(h=>{const cur=housing.find(x=>x.id==p.home)||{tier:0},own=h.tier<=cur.tier,here=h.id==p.home;return `<div class="card row sp"><div><b>${h.name}</b><div class="mut">Rest +${h.energy_bonus} energy · Storage ${h.storage}</div></div>${here?'<b style="color:var(--leaf)">Living here</b>':own?'<span class="mut">Owned tier</span>':`<button data-a="buy" data-i="${h.id}" ${p.wallet<h.price?'disabled':''}>${N(h.price)}</button>`}</div>`}).join('');
a.innerHTML=head+v+`<nav>${[['home','Home'],['jobs','Jobs'],['eat','Eat'],['house','Housing'],['court','Court']].map(t=>`<button data-a="go" data-i="${t[0]}" class="${tab==t[0]?'on':''}">${t[1]}</button>`).join('')}</nav>`}
sb.auth.getSession().then(r=>r.data.session?load():render());
</script></body></html>
